services:
  previewforge:
    build: .
    container_name: previewforge
    restart: unless-stopped
    ports:
      - "9850:9850"
      - "31000-32000:31000-32000"
    environment:
      - PREVIEWFORGE_DOMAIN=${PREVIEWFORGE_DOMAIN:-localhost}
      - PREVIEWFORGE_PORT=9850
      - PREVIEWFORGE_PROXY_MODE=${PREVIEWFORGE_PROXY_MODE:-standalone}
      - PREVIEWFORGE_PORT_START=31000
      - PREVIEWFORGE_PORT_END=32000
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
      - PREVIEWFORGE_DATA_DIR=/data
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/data
